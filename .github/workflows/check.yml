name: Native distribution checks

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  modes:
    name: Verify (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [packed, dev]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm check:${{ matrix.mode }}

  check:
    name: check
    if: always()
    needs: modes
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful mode matrix
        run: test "${{ needs.modes.result }}" = success
