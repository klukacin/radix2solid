packages:
  - packages/*
  - apps/*

managePackageManagerVersions: false
strictPeerDependencies: true

overrides:
  solid-js: 2.0.0-rc.19
  "@solidjs/web": 2.0.0-rc.19
  "@solidjs/signals": 2.0.0-rc.19
  "@solidjs/compiler": 2.0.0-rc.19
  "@solidjs/babel-plugin": 2.0.0-rc.19

peerDependencyRules:
  allowedVersions:
    "@typescript-eslint/project-service>typescript": "7"
    "@typescript-eslint/tsconfig-utils>typescript": "7"
    "@typescript-eslint/typescript-estree>typescript": "7"
    "@typescript-eslint/utils>typescript": "7"

# The global 24h minimumReleaseAge stays. Exact-version exceptions only: the rc.19 Solid tuple
# and compiler platform packages, plus the matching Vite plugin next.52. Remove once aged and a
# frozen install proves the same versions resolve without them.
minimumReleaseAgeExclude:
  - "@playwright/test@1.64.0"
  - playwright-core@1.64.0
  - playwright@1.64.0
  - solid-js@2.0.0-rc.19
  - "@solidjs/web@2.0.0-rc.19"
  - "@solidjs/signals@2.0.0-rc.19"
  - "@solidjs/compiler@2.0.0-rc.19"
  - "@solidjs/compiler-darwin-arm64@2.0.0-rc.19"
  - "@solidjs/compiler-darwin-x64@2.0.0-rc.19"
  - "@solidjs/compiler-linux-arm64-gnu@2.0.0-rc.19"
  - "@solidjs/compiler-linux-x64-gnu@2.0.0-rc.19"
  - "@solidjs/compiler-wasm32-wasi@2.0.0-rc.19"
  - "@solidjs/compiler-win32-x64-msvc@2.0.0-rc.19"
  - "@solidjs/babel-plugin@2.0.0-rc.19"
  - "@solidjs/vite-plugin@3.0.0-next.52"
